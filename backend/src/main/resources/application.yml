server:
  port: ${PORT:8080}

spring:
  application:
    name: portfolio-api
  datasource:
    url: jdbc:h2:mem:portfolio;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  h2:
    console:
      enabled: false

app:
  cors:
    # 쉼표로 여러 개 지정 가능. 배포 시 환경변수 APP_CORS_ALLOWED_ORIGINS 로 덮어쓴다.
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5500,http://127.0.0.1:5500,http://localhost:3000}
